version: 2

models:
  - name: stg_greenery__users
    description: Staging model for Greenery users.
    columns:
      - name: user_guid
        description: User GUID
        data_tests:
          - not_null
          - unique

  - name: stg_greenery__events
    description: Staging model for Greenery events.
    columns:
      - name: event_guid
        description: Event GUID
        data_tests:
          - not_null
          - unique
      - name: event_type
        description: Event type
        data_tests:
          - accepted_values:
              arguments:
                values: ['page_view', 'add_to_cart', 'checkout', 'package_shipped']

  - name: stg_greenery__orders
    description: Staging model for Greenery orders.

  - name: stg_greenery__addresses
    description: Staging model for Greenery addresses.

  - name: stg_greenery__products
    description: Staging model for Greenery products.

  - name: stg_greenery__order_items
    description: Staging model for Greenery order items.

  - name: stg_greenery__promos
    description: Staging model for Greenery promotions.
