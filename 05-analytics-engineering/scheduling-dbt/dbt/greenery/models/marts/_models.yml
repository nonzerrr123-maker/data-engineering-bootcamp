version: 2

models:
  - name: number_of_users
    description: Number of distinct Greenery users.
    columns:
      - name: user_count
        data_tests:
          - not_null

  - name: number_of_orders
    description: Number of distinct Greenery orders.
    columns:
      - name: order_count
        data_tests:
          - not_null

  - name: user_repeat_rate
    description: Share of ordering users who placed at least two distinct orders.

  - name: fct_orders
    description: Order fact model built from the joined intermediate order model.
