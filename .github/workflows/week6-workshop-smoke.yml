name: Week 6 Workshop Smoke

on:
  pull_request:
    paths:
      - "06-data-infrastructure-for-gen-ai-app/**"
      - "00-bootcamp-project/dags/llm_course_data_pipeline.py"
      - "00-bootcamp-project/docker/Dockerfile-airflow"
      - "00-bootcamp-project/start_week6.sh"
      - ".github/workflows/week6-workshop-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "06-data-infrastructure-for-gen-ai-app/**"
      - "00-bootcamp-project/dags/llm_course_data_pipeline.py"
      - "00-bootcamp-project/docker/Dockerfile-airflow"
      - "00-bootcamp-project/start_week6.sh"
      - ".github/workflows/week6-workshop-smoke.yml"

jobs:
  python-workshop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-data-infrastructure-for-gen-ai-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Week 6 test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "google-genai==1.66.0" \
            "google-cloud-bigquery>=3.34.0,<4.0.0" \
            "pandas-gbq==0.29.2" \
            pandas \
            numpy \
            pyarrow \
            streamlit \
            pytest

      - name: Compile Week 6 Python
        run: |
          python -m compileall -q .
          python -m py_compile ../00-bootcamp-project/dags/llm_course_data_pipeline.py

      - name: Run Week 6 offline tests
        run: pytest -q tests/test_week6_workshop.py


  poetry-environments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install "poetry==2.4.2"

      - name: Install root Week 6 lockfile
        working-directory: 06-data-infrastructure-for-gen-ai-app
        run: |
          poetry install --no-interaction
          poetry run python -c "from google import genai; from google.cloud import bigquery; import pandas_gbq; print('Root Week 6 Poetry environment OK')"

      - name: Install Streamlit app lockfile
        working-directory: 06-data-infrastructure-for-gen-ai-app/qna_app
        run: |
          poetry install --no-interaction
          poetry run python -c "import streamlit; from google import genai; from google.cloud import bigquery; print('Q&A Poetry environment OK')"

  airflow-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Week 6 Airflow image
        run: |
          docker build \
            -f 00-bootcamp-project/docker/Dockerfile-airflow \
            -t deb-week6-airflow-smoke \
            00-bootcamp-project/docker

      - name: Verify Week 6 dependencies in image
        run: |
          docker run --rm deb-week6-airflow-smoke \
            python -c "from google import genai; import pandas_gbq, pyarrow; print('Week 6 dependencies OK')"

      - name: Validate Week 6 DAG import and graph
        run: |
          docker run --rm \
            -e GEMINI_API_KEY=dummy-ci-key \
            -v "$PWD/00-bootcamp-project/dags:/opt/airflow/dags:ro" \
            deb-week6-airflow-smoke \
            python - <<'PY'
          import importlib.util

          path = "/opt/airflow/dags/llm_course_data_pipeline.py"
          spec = importlib.util.spec_from_file_location("week6_dag", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          dag = module.dag
          assert dag.dag_id == "llm_course_data_pipeline"
          assert set(dag.task_ids) == {
              "gather_data",
              "get_embeddings",
              "load_data_to_bigquery",
          }
          assert dag.get_task("get_embeddings").upstream_task_ids == {"gather_data"}
          assert dag.get_task("load_data_to_bigquery").upstream_task_ids == {"get_embeddings"}
          print("Week 6 Airflow DAG graph OK")
          PY
