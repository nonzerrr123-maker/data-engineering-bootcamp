# Day 4 Spark defaults: keep this intentionally small.
# The Greenery project only needs standalone Spark + the bundled GCS connector.
# Avoid unrelated Delta/S3/Postgres Maven packages here because spark-submit
# resolves spark.jars.packages before the application starts and a bad package
# coordinate makes the Airflow transform task fail before our code can run.

spark.master                           spark://spark-master:7077
spark.eventLog.enabled                 true
spark.eventLog.dir                     /opt/spark/spark-events
spark.history.fs.logDirectory          /opt/spark/spark-events
spark.sql.codegen.wholeStage           false
spark.ui.prometheus.enabled            true

# GCS connector classes are copied into SPARK_HOME/jars by the Dockerfiles.
spark.hadoop.fs.gs.impl                com.google.cloud.hadoop.fs.gcs.GoogleHadoopFileSystem
spark.hadoop.fs.AbstractFileSystem.gs.impl com.google.cloud.hadoop.fs.gcs.GoogleHadoopFS
