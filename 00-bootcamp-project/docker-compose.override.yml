# Day 4 local runtime overrides.
# Keep custom images separate from upstream tags and make every Spark service buildable.
services:
  airflow-apiserver:
    image: day4-airflow:3.3.0

  airflow-scheduler:
    image: day4-airflow:3.3.0

  airflow-dag-processor:
    image: day4-airflow:3.3.0

  airflow-init:
    image: day4-airflow:3.3.0

  airflow-cli:
    image: day4-airflow:3.3.0

  spark-master:
    image: day4-spark:4.1.0
    build:
      context: docker
      dockerfile: Dockerfile-spark

  spark-history:
    image: day4-spark:4.1.0
    build:
      context: docker
      dockerfile: Dockerfile-spark

  spark-worker:
    image: day4-spark:4.1.0
    build:
      context: docker
      dockerfile: Dockerfile-spark
