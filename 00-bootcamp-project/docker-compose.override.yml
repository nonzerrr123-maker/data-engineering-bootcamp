# Day 4 local runtime overrides.
# Keep custom images separate from upstream tags, make every Spark service buildable,
# and provide the Airflow Spark connection automatically.
services:
  airflow-apiserver:
    image: day4-airflow:3.3.0
    environment:
      AIRFLOW_CONN_MY_SPARK: "spark://spark-master:7077?deploy-mode=client&spark_binary=spark-submit"

  airflow-scheduler:
    image: day4-airflow:3.3.0
    environment:
      AIRFLOW_CONN_MY_SPARK: "spark://spark-master:7077?deploy-mode=client&spark_binary=spark-submit"

  airflow-dag-processor:
    image: day4-airflow:3.3.0
    environment:
      AIRFLOW_CONN_MY_SPARK: "spark://spark-master:7077?deploy-mode=client&spark_binary=spark-submit"

  airflow-init:
    image: day4-airflow:3.3.0
    environment:
      AIRFLOW_CONN_MY_SPARK: "spark://spark-master:7077?deploy-mode=client&spark_binary=spark-submit"

  airflow-cli:
    image: day4-airflow:3.3.0
    environment:
      AIRFLOW_CONN_MY_SPARK: "spark://spark-master:7077?deploy-mode=client&spark_binary=spark-submit"

  spark-master:
    image: day4-spark:4.1.0
    build:
      context: docker
      dockerfile: Dockerfile-spark

  spark-history:
    image: day4-spark:4.1.0
    build:
      context: docker
      dockerfile: Dockerfile-spark

  spark-worker:
    image: day4-spark:4.1.0
    build:
      context: docker
      dockerfile: Dockerfile-spark
